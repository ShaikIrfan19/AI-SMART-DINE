name: Live GitHub Pages Deployment and Selenium E2E Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize with master workflow to avoid gh-pages lock conflicts
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-and-selenium-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://ShaikIrfan19.github.io/AI-SMART-DINE/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run E2E Test Suite and Report Generator
        run: |
          node testing/reporting/master-report-generator.js
          node testing/reporting/excel-report-generator.js

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E2E-Test-Reports
          path: "Test Results/**"
          retention-days: 30

      - name: Publish Summary to GitHub Actions
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "## All Tests Passed!" >> $GITHUB_STEP_SUMMARY
          fi
