name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-android-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Master Report & Test Harness
        run: |
          node testing/reporting/master-report-generator.js
          node testing/reporting/excel-report-generator.js

      - name: Upload Appium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Android-Test-Results
          path: Test Results/
          retention-days: 30
